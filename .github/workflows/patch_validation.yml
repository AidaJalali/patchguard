name: Patchguard tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang binutils gdb llvm-18-tools
          python -m pip install -r requirements.txt
      - name: Run unit and compiled-fixture tests
        run: python -m pytest -q --junitxml=artifacts/tests.xml
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: warn
  docker-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang binutils gdb llvm-18-tools
          python -m pip install -r requirements.txt
      - name: Build the sandbox image
        run: docker build -t patchguard-sandbox:latest .
      - name: Require a usable Docker sandbox
        run: |
          docker info
          docker image inspect patchguard-sandbox:latest
      - name: Run container and cross-module integration tests
        run: python -m pytest -q tests/test_person1.py tests/test_person1_integration.py tests/test_validation.py --junitxml=artifacts/docker-tests.xml
      - name: Publish Docker test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-results
          path: artifacts/
          if-no-files-found: warn
  scenarios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scenario dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang binutils gdb llvm-18-tools
          python -m pip install -r requirements.txt
      - name: Build the sandbox image
        run: docker build -t patchguard-sandbox:latest .
      - name: Run the scenario matrix
        run: ./run_all_scenarios.sh
      - name: Publish scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-artifacts
          path: /tmp/patchguard-scenarios/
          if-no-files-found: warn
